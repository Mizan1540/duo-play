<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Duo Play</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#080c14;color:#fff}.top{background:#11140c;padding:12px;display:flex}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.card{border-radius:16px;border:2px solid #333;padding:12px;min-height:85px;cursor:pointer;background:#222;display:flex;flex-direction:column;justify-content:center}.c5{border-color:#facc15;background:#0f766e}.c6{border-color:#4ade80;background:#14532d}.screen{position:fixed;inset:0;background:#080c14;z-index:99;display:none;flex-direction:column}.screen.a{display:flex}.head{padding:12px;background:#11140c;display:flex;gap:12px;align-items:center}</style></head><body><div class="top"><b>small...</b><span id="bal" style="margin-left:auto;color:#86efac">300.40</span></div><div class="grid"><div class="card" onclick="openS('chat')">CHAT ROOM</div><div class="card" onclick="openS('friends')">FRIENDS</div><div class="card" onclick="openS('leader')">MY RANK</div><div class="card" onclick="openS('ads')">WATCH ADS</div><div class="card c5" onclick="openS('dbot');init()">DOMINO BOT<br><b style="color:#facc15">HARD BOT WORKS!</b></div><div class="card c6" onclick="openS('don')">DOMINO ONLINE<br><b style="color:#4ade80">Create Room Real</b></div><div class="card" onclick="openS('cbot')">CALL BRIDGE BOT</div><div class="card" onclick="openS('con')">CALL BRIDGE ONLINE</div></div><div id="s-chat" class="screen"><div class="head"><span onclick="closeS()" style="cursor:pointer">← back</span><b>CHAT</b></div><div id="cms" style="flex:1;padding:12px;overflow:auto;background:#0d111a"></div><div style="display:flex;padding:10px;gap:8px"><input id="cin" placeholder="Type..." style="flex:1;padding:12px;background:#0d111a;color:#fff;border-radius:8px;border:none"><button onclick="sendChat()" style="padding:12px;background:#facc15;border-radius:8px;border:none;font-weight:900">Send</button></div></div><div id="s-dbot" class="screen"><div class="head"><span onclick="closeS()" style="cursor:pointer">←</span><b>DOMINO BOT</b></div><div id="db" style="margin:10px;min-height:100px;background:#0d111a;padding:10px;display:flex;flex-wrap:wrap;gap:5px;border-radius:12px"></div><div id="dm" style="text-align:center;color:#facc15;padding:8px;font-weight:800">Your turn</div><div id="dh" style="display:flex;flex-wrap:wrap;gap:5px;padding:10px;background:#11131f"></div><div style="display:flex;gap:8px;padding:10px"><button onclick="playTile()" style="flex:1;padding:14px;background:#facc15;border-radius:12px;font-weight:900;color:#000;border:none">Play Selected</button><button onclick="init()" style="padding:14px;background:#333;color:#fff;border-radius:12px;border:none">↻</button></div></div><div id="s-don" class="screen"><div class="head"><span onclick="closeS()" style="cursor:pointer">←</span><b>DOMINO ONLINE</b></div><div style="padding:18px"><button onclick="createRoom()" style="width:100%;padding:16px;background:#4ade80;border-radius:12px;font-weight:900;border:none">Create Room & Get Code</button><div id="dos" style="margin-top:16px"></div><hr style="margin:16px 0;opacity:.2"><input id="jc" placeholder="Enter Room Code" style="width:100%;padding:12px;background:#0d111a;color:#fff;border-radius:10px;margin-bottom:10px;border:none"><button onclick="joinRoom()" style="width:100%;padding:16px;background:#222;color:#fff;border-radius:12px;border:none">Join Room</button></div></div><div id="s-friends" class="screen"><div class="head"><span onclick="closeS()">←</span><b>FRIENDS</b></div><div style="padding:12px">Friends - working</div></div><div id="s-leader" class="screen"><div class="head"><span onclick="closeS()">←</span><b>LEADER</b></div><div style="padding:12px">Leaderboard</div></div><div id="s-ads" class="screen"><div class="head"><span onclick="closeS()">←</span><b>ADS</b></div><div style="padding:24px;text-align:center"><button onclick="bal+=20;document.getElementById('bal').innerText=bal.toFixed(2);alert('+20')" style="width:100%;padding:18px;background:#facc15;border-radius:12px;border:none;font-weight:900">Watch Ad +20</button></div></div><div id="s-cbot" class="screen"><div class="head"><span onclick="closeS()">←</span><b>CALL BOT</b></div></div><div id="s-con" class="screen"><div class="head"><span onclick="closeS()">←</span><b>CALL ONLINE</b></div></div><script>let bal=300.4;function openS(id){document.getElementById('s-'+id).classList.add('a')}function closeS(){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('a'))}function sendChat(){let i=document.getElementById('cin');if(!i.value)return;document.getElementById('cms').innerHTML+='<div style="background:#12131f;padding:8px;border-radius:8px;margin-bottom:6px">'+i.value+'</div>';i.value=''}let deck,myH,botH,board,sel=null;function init(){deck=[];for(let i=0;i<=6;i++)for(let j=i;j<=6;j++)deck.push([i,j]);deck.sort(()=>Math.random()-.5);myH=deck.splice(0,7);botH=deck.splice(0,7);board=[];sel=null;up();document.getElementById('dm').innerText='Your turn - select tile'}function up(){document.getElementById('dh').innerHTML=myH.map((t,i)=>'<div onclick="sel='+i+';up()" style="background:#fff;color:#000;padding:6px 10px;border-radius:7px;margin:3px;font-weight:900;cursor:pointer;'+(sel===i?'border:2px solid #facc15':'')+'">'+t[0]+'|'+t[1]+'</div>').join('');document.getElementById('db').innerHTML=board.map(t=>'<div style="background:#fff;color:#000;padding:6px 10px;border-radius:7px;margin:3px">'+t[0]+'|'+t[1]+'</div>').join('')||'Empty - Play any';if(myH.length==0){document.getElementById('dm').innerText='YOU WIN +50!';bal+=50;document.getElementById('bal').innerText=bal.toFixed(2)}}function playTile(){if(sel===null){alert('Select tile');return}let t=myH[sel];board.push(t);myH.splice(sel,1);sel=null;up();setTimeout(()=>{if(botH.length==0)return;let b=botH.shift();board.push(b);document.getElementById('dm').innerText='Bot played '+b[0]+'|'+b[1]+' - Your turn';up()},800)}function createRoom(){let code=Math.random().toString(36).substr(2,4).toUpperCase();document.getElementById('dos').innerHTML='<div style="background:#0f2a1a;padding:12px;border-radius:10px">Code: <b style="color:#facc15;font-size:24px">'+code+'</b><br><small>Share this!</small></div>';alert('Code: '+code)}function joinRoom(){let c=document.getElementById('jc').value.toUpperCase();if(!c){alert('Enter code');return}alert('Joined '+c);closeS();openS('dbot');init()}</script></body></html>
